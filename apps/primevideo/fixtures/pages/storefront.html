<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Prime Video stand-in: home</title>
<!-- A stand-in for Prime Video's home page, made by hand, for the d-pad's
     checks. Its rows are drawn the way the storefront draws its rows: a
     wrapper (navigation-carousel-wrapper) holding a list of cards
     (card-container-list) between a left and a right arrow. Each card is an
     <article data-testid=card> whose packshot has a button over it and its
     title's link as hidden text.

     What it does in a script isn't from a captured page, which has no
     styles or scripts: the arrows show only under a pointer, a row slides
     on by the cards in sight when its arrow is pressed, and the card's
     button opens the title. More rows load as the page nears its end, up to six.
     Each row's arrows put where the row is in the page's title, for the
     checks to see the row slid. The titles are made up, and every card
     opens the stand-in film's page. -->
<style>
  body { margin: 0; background: #0f171e; color: #eee; font: 24px sans-serif; }
  nav { display: flex; align-items: center; gap: 24px; padding: 24px 48px; }
  nav a { color: #eee; padding: 8px 16px; }
  .hero { height: 360px; margin: 0 48px 24px; border-radius: 8px; background: #1b2a38; }
  h2 { margin: 24px 48px 8px; font-size: 24px; }
  [data-testid=navigation-carousel-wrapper] > section > div { position: relative; overflow: hidden; margin: 0 48px; }
  [data-testid=card-container-list] { display: flex; gap: 16px; margin: 0; padding: 8px 0; list-style: none; }
  [data-testid=card-container-list] li { flex: 0 0 340px; }
  [data-testid=packshot] { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; background: #234; }
  [data-testid=packshot] > button { position: absolute; inset: 0; border: 0; background: transparent; cursor: pointer; }
  [data-testid=packshot] > a { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  [data-testid=left-arrow], [data-testid=right-arrow] { position: absolute; top: 0; bottom: 0; width: 48px; border: 0; background: rgba(0, 0, 0, 0.6); color: #eee; opacity: 0; }
  [data-testid=left-arrow] { left: 0; }
  [data-testid=right-arrow] { right: 0; }
  [data-testid=navigation-carousel-wrapper]:hover button[data-testid] { opacity: 1; }
  footer { padding: 48px; color: #999; }
</style>
<body>
  <nav>
    <a href="/region/eu/storefront" data-testid="pv-nav-home-home">Home</a>
    <a href="/region/eu/storefront/movie" aria-label="Movies">Movies</a>
    <a href="/region/eu/storefront/tv" aria-label="TV shows">TV shows</a>
    <a href="/region/eu/signout" data-testid="pv-nav-sign-out">Sign Out</a>
  </nav>
  <div class="hero"></div>
  <div id="rows"></div>
  <div id="more"></div>
  <footer>Help and feedback</footer>
<script>
  const NAMES = ["Lantern Bay", "Northern Tide", "Paper Moons", "The Quiet Mile", "Saltwater Kings", "Glass Orchard", "Low Harbour", "Seven Bridges", "Ash and Ember", "The Long Field", "Winter Lines", "Copper Coast"];
  const rows = document.getElementById("rows");
  const card = (r, n) => {
    const title = `${NAMES[(r + n) % NAMES.length]} ${r}.${n}`;
    const li = document.createElement("li");
    li.dataset.index = String(n);
    li.innerHTML = `<article data-testid="card" data-card-title="${title}" data-card-entity-type="Movie"><section data-testid="card-section"><div data-testid="packshot"><button aria-label="${title}" aria-expanded="false"></button><a href="/region/eu/detail/0LANTERNMOVIE00000000002?ref_=atv_hm_c_${r}_${n}" tabindex="-1">${title}</a></div></section></article>`;
    li.querySelector("button").addEventListener("click", () => (location.href = li.querySelector("a").href));
    return li;
  };
  const addRow = (r) => {
    const heading = document.createElement("h2");
    heading.textContent = `Row ${r}`;
    const wrapper = document.createElement("div");
    wrapper.dataset.testid = "navigation-carousel-wrapper";
    wrapper.innerHTML = `<section><div><button tabindex="-1" aria-label="previous title" data-testid="left-arrow" data-disabled="true"></button><ul data-testid="card-container-list"></ul><button tabindex="-1" aria-label="Move forward" data-testid="right-arrow" data-disabled="false"></button></div></section>`;
    const list = wrapper.querySelector("ul");
    for (let n = 1; n <= 12; n++) list.append(card(r, n));
    const left = wrapper.querySelector("[data-testid=left-arrow]");
    const right = wrapper.querySelector("[data-testid=right-arrow]");
    // A press slides it on by the cards that are in sight.
    let at = 0;
    const slide = (way) => {
      const page = Math.max(1, Math.floor(list.parentElement.clientWidth / 356));
      at = Math.max(0, Math.min(12 - page, at + way * page));
      list.style.transform = `translateX(${-at * 356}px)`;
      left.dataset.disabled = String(at === 0);
      right.dataset.disabled = String(at === 12 - page);
      document.title = `Prime Video stand-in: row ${r} at ${at + 1}`;
    };
    left.addEventListener("click", () => slide(-1));
    right.addEventListener("click", () => slide(1));
    rows.append(heading, wrapper);
  };
  for (let r = 1; r <= 3; r++) addRow(r);
  let made = 3;
  const more = document.getElementById("more");
  let loading = false;
  const watch = new IntersectionObserver((seen) => {
    if (!seen.some((entry) => entry.isIntersecting) || loading || made >= 6) return;
    loading = true;
    setTimeout(() => {
      addRow(++made);
      loading = false;
      watch.unobserve(more);
      watch.observe(more);
    }, 150);
  }, { rootMargin: "0px 0px 200px 0px" });
  watch.observe(more);
</script>
</body>
</html>
